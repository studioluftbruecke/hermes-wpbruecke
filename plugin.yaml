name: wpbruecke
version: "0.2.0"
description: "WPBrücke · for WordPress: run one WordPress site or many from Hermes. Hermes works on your WordPress sites as a WordPress user you create for it. Its role decides what Hermes may do: read, write drafts, or publish. WPBrücke refuses a user with wider rights than the level you confirmed. Hermes proves every change in a real browser at three widths and checks SEO; a review desk in Hermes Desktop shows every draft and staged change with its proof. Works on plain WordPress with an application password; an optional connector plugin adds a read-only role, a drafter role, signed draft previews and SEO fields; GeneratePress is an optional pack."
author: "Studio Luftbrücke"
license: MIT
requires_hermes: ">=0.23.0"
provides_tools:
  - wp_doctor
  - wp_sites
  - wp_content
  - wp_draft
  - wp_desk
  - wp_proof
  - wp_seo
  - wp_build
provides_hooks:
  - pre_tool_call
  - post_approval_response
config_schema:
  site1_url:
    type: string
    default: ""
    label: "Site 1 · address"
    description: "The address of a WordPress site Hermes works on (https://example.com); the WPBrücke page, Connect a site, walks you through it."
  site1_user:
    type: string
    default: ""
    label: "Site 1 · WordPress user"
    description: "The WordPress user Hermes works as on Site 1 (its login or email); create one for Hermes and give it the role for what Hermes may do."
  site1_password:
    type: secret
    env: WPBRUECKE_KEY1
    label: "Site 1 · application password"
    description: "The application password of Site 1's WordPress user (wp-admin, Users, the user, Application Passwords)."
